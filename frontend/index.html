<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Commerce Readiness — Vendor Console</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='25' font-size='24'>&#9673;</text></svg>">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <h1>AI Commerce Readiness</h1>
        <p>Can an AI shopping agent recommend this product — and explain why?</p>
      </div>
    </div>

    <div class="connection">
      <div class="status" id="status" data-state="unknown">
        <span class="dot" aria-hidden="true"></span>
        <span id="status-text">Not connected</span>
      </div>
      <button id="settings-toggle" class="settings-button" type="button" aria-label="Connection settings" aria-expanded="false">⚙</button>
      <div id="settings-menu" class="settings-menu" hidden>
        <label class="field"><span>Backend URL</span><input id="api-base" type="url" spellcheck="false" autocomplete="off" placeholder="http://127.0.0.1:8000"></label>
        <button id="reconnect" class="btn" type="button">Reconnect</button>
        <div class="versions" id="versions" hidden></div>
      </div>
    </div>
  </header>

  <main class="workspace">
    <section id="editor-panel" class="panel editor" aria-label="Product data">
      <div class="panel-head">
        <div class="product-heading">
          <select id="catalog-product" aria-label="Current catalog product" hidden></select>
          <h2>Product data</h2>
        </div>
        <div class="seg" role="group" aria-label="Editor mode">
          <button class="seg-btn is-active" data-view="form" type="button">Form</button>
          <button class="seg-btn" data-view="json" type="button">JSON</button>
        </div>
      </div>

      <div class="samples">
        <span class="samples-label">Load sample</span>
        <div id="sample-buttons" class="sample-buttons"></div>
      </div>

      <div class="catalog-tools">
        <input id="database-file" class="file-input" type="file" accept=".db,.sqlite,.sqlite3" aria-label="SQLite catalog file">
        <label id="drop-zone" for="database-file" class="drop-zone">
          <span class="drop-icon">⇧</span>
          <span><strong>Drop a database here</strong><small>or click to choose · imports automatically</small></span>
          <span id="database-name" class="database-name">.db, .sqlite, .sqlite3</span>
        </label>
      </div>

      <div class="panel-body">
        <div id="form-view"></div>
        <div id="json-view" hidden>
          <p class="hint">This is the exact payload sent to <code>POST /api/v1/score</code>. Edit it, then apply it to replace the draft.</p>
          <textarea id="json-editor" spellcheck="false" aria-label="Product JSON"></textarea>
          <div class="json-actions">
            <button id="json-apply" class="btn" type="button">Apply JSON</button>
            <button id="json-copy" class="btn ghost" type="button">Copy</button>
            <span id="json-message" class="inline-message"></span>
          </div>
        </div>
        <div id="suggestions" hidden></div>
      </div>

      <footer class="panel-foot">
        <div id="editor-message" class="inline-message" role="status"></div>
        <div class="actions">
          <button id="generate" class="btn ghost" type="button">Generate suggestions</button>
          <button id="score" class="btn primary" type="button">Score product</button>
        </div>
      </footer>
    </section>

    <section id="results-panel" class="panel results" aria-label="Readiness result">
      <div id="results"></div>
    </section>
  </main>

  <section class="coach" aria-label="AI readiness coach">
    <div class="coach-head"><strong>AI readiness coach</strong><span>Updates this product from your answers</span></div>
    <div id="coach-messages" class="coach-messages" aria-live="polite"></div>
    <form id="coach-form" class="coach-bar">
      <input id="coach-answer" type="text" autocomplete="off" placeholder="Answer the readiness coach…">
      <button id="coach-skip" class="btn ghost" type="button">Skip</button>
      <button class="send-btn" type="submit" aria-label="Send answer">↑</button>
    </form>
  </section>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
